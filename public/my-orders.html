<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Orders | Friends Of Mine</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container navbar">
        <div class="brand">
          <div class="brand-mark">F</div>
          <span>Friends Of Mine</span>
        </div>
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="checkout.html">Checkout</a>
        </nav>
      </div>
    </header>

    <main class="container" style="padding-top:40px; padding-bottom:80px;">
      <div class="form-shell">
        <h2>My Orders</h2>
        <div class="table-wrap">
          <table class="orders-table">
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Name</th>
                <th>Items</th>
                <th>Total</th>
                <th>Status</th>
                <th>Delivery</th>
                <th>Time</th>
              </tr>
            </thead>
            <tbody id="ordersTableBody"></tbody>
          </table>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-bar">
        <div class="footer-copy">
          <div class="footer-brand">Friends Of Mine</div>
          <span>© 2026 Friends Of Mine · Dhangadi, Nepal</span>
        </div>
        <div class="footer-actions" aria-label="Footer links">
          <a class="footer-action" href="tel:9800000000">Call us</a>
          <a class="footer-action" href="mailto:hello@friendsofmine.com">Email</a>
          <a class="footer-action" href="index.html">Home</a>
          <a class="footer-action footer-action-primary" href="checkout.html">Order now</a>
        </div>
      </div>
    </footer>

    <script src="js/tracker.js"></script>
    <script src="js/orders-list.js"></script>
  </body>
</html>
